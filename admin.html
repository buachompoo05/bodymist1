<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ | Body Scent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้า admin */
    .page-title { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.5; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--c-line);
      background: var(--c-white);
    }

    .orders-table {
      width: 100%;
      min-width: 52rem;
      border-collapse: collapse;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    .orders-table th,
    .orders-table td {
      padding: 1rem 1.25rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--c-line);
    }

    .orders-table th {
      font-family: var(--f-heading-th);
      font-weight: 500;
      white-space: nowrap;
      color: var(--c-ink);
      background: var(--c-cream);
      border-bottom: 1px solid var(--c-gold-soft);
    }

    .orders-table td { color: var(--c-ink-soft); }
    .orders-table td:first-child { white-space: nowrap; }
    .orders-table th:nth-child(5),
    .orders-table td:nth-child(5) { text-align: right; white-space: nowrap; }
    .orders-table tbody tr:last-child td { border-bottom: 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section__head">
        <h1 class="page-title">รายการสั่งซื้อ</h1>
        <hr class="rule">
        <p>แสดงรายการล่าสุดก่อน</p>
      </div>

      <div class="table-wrap">
        <table id="ordersTable" class="orders-table">
          <thead>
            <tr>
              <th scope="col">วันเวลา</th>
              <th scope="col">ชื่อลูกค้า</th>
              <th scope="col">เบอร์โทร/Line</th>
              <th scope="col">รายการสินค้า</th>
              <th scope="col">จำนวนเงินรวม</th>
              <th scope="col">หมายเหตุ</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
      <p>&copy; 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
