<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Body Scent</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="style.css">
  <style>
    /* เฉพาะหน้า order */
    .page-title { font-size: clamp(2rem, 4vw, 3rem); line-height: 1.5; }
    .order-form { max-width: 34rem; margin-inline: auto; }
    .field textarea { resize: vertical; line-height: 1.8; }
    .field input::placeholder,
    .field textarea::placeholder { color: var(--c-ink-mute); opacity: 0.7; }
    .field__hint { margin: 0.3rem 0 0; font-size: 0.8rem; color: var(--c-ink-mute); }
    .field__hint a { color: var(--c-gold-deep); border-bottom: 1px solid var(--c-gold-soft); }
    .order-form .btn { margin-top: var(--s-3); }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="logo" href="index.html">Body Scent</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section__head">
        <h1 class="page-title">สั่งซื้อสินค้า</h1>
        <hr class="rule">
        <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันการสั่งซื้อ</p>
      </div>

      <form id="orderForm" class="order-form">
        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" autocomplete="tel" required>
        </div>

        <div class="field">
          <label for="items">รายการสินค้า</label>
          <textarea id="items" name="items" rows="2" required></textarea>
          <p class="field__hint">ต้องการเลือกสินค้าอื่น? <a href="product.html">กลับไปหน้าสินค้า</a></p>
        </div>

        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="text" id="total" name="total" inputmode="numeric" required>
        </div>

        <div class="field">
          <label for="note">หมายเหตุ (ไม่บังคับ)</label>
          <textarea id="note" name="note" rows="3" placeholder="เช่น ที่อยู่จัดส่ง หรือคำขอเพิ่มเติม"></textarea>
        </div>

        <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">Body Scent</span>
      <p>&copy; 2026 Body Scent สงวนลิขสิทธิ์</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
